name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repo-safety:
    name: No personal data or secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/check_public_repo.py --history

  backend:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: Fitness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: Fitness/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Run tests (fake data only, no network)
        env:
          KAISEN_DATA_DIR: ${{ runner.temp }}/kaisen-test-data
        run: python -m pytest

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Fitness/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Fitness/frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint src
      - run: npm run build

  dependency-audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: pip-audit
        run: |
          python -m pip install pip-audit
          pip-audit -r Fitness/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (high and critical)
        working-directory: Fitness/frontend
        run: npm audit --audit-level=high
